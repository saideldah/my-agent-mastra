<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem('color-scheme');
        if (savedScheme === 'light' || savedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = savedScheme;
        } else if (!localStorage.getItem('color-scheme-initialized')) {
          localStorage.setItem('color-scheme', 'light');
          localStorage.setItem('color-scheme-initialized', '1');
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      } catch (e) {}
    </script>
